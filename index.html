<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique Traders | Inventory Management</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2266%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22>U</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">UT</div>
      <h1>Unique Traders</h1>
      <p>Inventory Management System</p>
    </div>
    <form id="login-form" class="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" placeholder="e.g. admin" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <div id="login-error" class="login-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div class="login-hint">
      <strong>Demo accounts</strong>
      <div class="hint-row"><span>Admin</span><code>admin / admin123</code></div>
      <div class="hint-row"><span>Staff</span><code>staff / staff123</code></div>
    </div>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app-shell" class="app-shell" hidden>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark small">UT</div>
      <div class="brand-text">
        <strong>Unique Traders</strong>
        <span>Inventory System</span>
      </div>
      <button id="sidebar-close" class="icon-btn only-mobile" aria-label="Close menu">✕</button>
    </div>
    <nav id="nav-list" class="nav-list"></nav>
    <div class="sidebar-footer">
      <span class="version-tag">v1.0 · Local Data</span>
    </div>
  </aside>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="main-col">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn only-mobile" aria-label="Open menu">☰</button>
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-right">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle dark mode">🌙</button>
        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-meta">
            <strong id="user-name">—</strong>
            <span id="user-role">—</span>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Log Out</button>
      </div>
    </header>

    <main id="page-content" class="page-content">
      <!-- page content injected here -->
    </main>
  </div>
</div>

<!-- ===== MODAL ROOT ===== -->
<div id="modal-root"></div>

<!-- ===== TOAST ROOT ===== -->
<div id="toast-root" class="toast-root"></div>

<!-- Chart.js from CDN (dashboard/report charts). App still works offline without it. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<!-- Core -->
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/real-catalog-data.js"></script>
<script src="js/seed.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/router.js"></script>

<!-- Pages -->
<script src="js/pages/login.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/products.js"></script>
<script src="js/pages/inventory.js"></script>
<script src="js/pages/sales.js"></script>
<script src="js/pages/customers.js"></script>
<script src="js/pages/payments.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/settings.js"></script>

<!-- Bootstrap -->
<script src="js/app.js"></script>
</body>
</html>
