<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash Memo – Unique Traders</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Barlow:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    /* ── VARIABLES ─────────────────────────────── */
    :root {
      --red: #c0392b; --gold: #d4a017; --dark: #0a0602;
      --dark2: #140a04; --dark3: #1e1008;
      --text: #f0e8d8; --text-dim: #a89880;
      --border: rgba(192,57,43,0.25); --border-g: rgba(212,160,23,0.2);
      --ff: 'Barlow', sans-serif; --ff-bn: 'Noto Sans Bengali', sans-serif;
      --ff-h: 'Playfair Display', serif;
    }

    /* ── SCREEN STYLES ─────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ff); background: var(--dark);
      color: var(--text); min-height: 100vh; padding: 0;
    }
    a { text-decoration: none; color: inherit; }

    /* APP LAYOUT */
    .app { display: flex; min-height: 100vh; }

    /* LEFT PANEL – FORM */
    .form-panel {
      width: 420px; flex-shrink: 0;
      background: var(--dark2);
      border-right: 1px solid var(--border);
      padding: 28px 24px;
      overflow-y: auto; height: 100vh;
      position: sticky; top: 0;
    }
    .panel-logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
      padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    .logo-ut {
      width: 36px; height: 36px; background: var(--red);
      color: #fff; font-family: var(--ff-h); font-size: 14px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; border: 1.5px solid var(--gold);
    }
    .panel-logo span { font-family: var(--ff-bn); font-size: 15px; font-weight: 700; }
    .panel-logo small { font-size: 10px; color: var(--gold); letter-spacing: 1px; display: block; }

    .section-head {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--red); font-weight: 600; margin-bottom: 12px; margin-top: 20px;
    }
    label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 12px; }
    input, select, textarea {
      width: 100%; background: var(--dark3);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: var(--ff); font-size: 14px;
      padding: 9px 12px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: rgba(212,160,23,0.5); }
    select option { background: var(--dark3); }
    textarea { resize: vertical; min-height: 64px; }

    /* ITEM ENTRY */
    .item-row {
      display: grid; grid-template-columns: 2fr 1fr 1.2fr auto;
      gap: 8px; align-items: end; margin-bottom: 8px;
    }
    .item-row .remove-btn {
      background: rgba(192,57,43,0.12); border: 1px solid var(--border);
      color: var(--red); border-radius: 6px; padding: 9px 10px;
      cursor: pointer; font-size: 14px; line-height: 1;
      transition: background 0.2s;
    }
    .item-row .remove-btn:hover { background: rgba(192,57,43,0.25); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border-radius: 6px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; font-family: var(--ff);
      transition: all 0.2s; letter-spacing: 0.3px;
    }
    .btn-add { background: rgba(212,160,23,0.12); border: 1px solid var(--border-g); color: var(--gold); margin-top: 4px; }
    .btn-add:hover { background: rgba(212,160,23,0.22); }
    .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
    .btn-clear:hover { color: var(--text); }
    .btn-print { background: var(--red); color: #fff; width: 100%; justify-content: center; margin-top: 16px; font-size: 14px; padding: 13px; }
    .btn-print:hover { background: #a93226; }

    .totals-preview {
      background: var(--dark3); border: 1px solid var(--border-g);
      border-radius: 8px; padding: 14px 16px; margin-top: 16px;
    }
    .tp-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--text-dim); }
    .tp-row.total { color: var(--gold); font-size: 15px; font-weight: 700; border-top: 1px solid var(--border-g); margin-top: 6px; padding-top: 10px; }
    .tp-row.paid { color: #4caf50; }
    .tp-row.due  { color: var(--red); }

    /* RIGHT PANEL – PREVIEW */
    .preview-panel {
      flex: 1; background: #e8e0d4;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 32px; overflow-y: auto;
    }
    .preview-label {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: #6b5d50; margin-bottom: 20px; font-weight: 600;
    }

    /* ── THE MEMO (shared screen + print) ─────── */
    .memo {
      background: #fff; width: 100%; max-width: 680px;
      font-family: var(--ff); color: #1a1a1a;
      border-radius: 4px; overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.18);
    }

    .memo-header {
      background: #0a0602; color: #f0e8d8;
      padding: 24px 28px; display: flex; align-items: center; justify-content: space-between;
    }
    .memo-logo { display: flex; align-items: center; gap: 14px; }
    .memo-logo-box {
      width: 48px; height: 48px; background: #c0392b;
      border: 2px solid #d4a017; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; font-family: 'Playfair Display', serif;
    }
    .memo-shop-bn { font-family: var(--ff-bn); font-size: 18px; font-weight: 700; line-height: 1.2; }
    .memo-shop-en { font-size: 10px; letter-spacing: 2px; color: #d4a017; margin-top: 2px; }
    .memo-header-right { text-align: right; font-size: 11px; color: #a89880; line-height: 1.8; }
    .memo-header-right strong { color: #f0e8d8; font-size: 13px; display: block; }

    .memo-meta {
      background: #f9f5f0; border-bottom: 2px solid #c0392b;
      padding: 14px 28px; display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 12px;
    }
    .memo-meta-block { font-size: 12px; line-height: 1.7; }
    .memo-meta-block strong { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #888; display: block; margin-bottom: 2px; }

    .memo-title {
      text-align: center; padding: 12px 28px 8px;
      font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      color: #888; border-bottom: 1px solid #e8e0d4;
    }
    .memo-title span { color: #c0392b; font-weight: 700; }

    /* ITEMS TABLE */
    .memo-table { width: 100%; border-collapse: collapse; }
    .memo-table thead { background: #0a0602; color: #f0e8d8; }
    .memo-table thead th {
      padding: 10px 14px; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; font-weight: 600; text-align: left;
    }
    .memo-table thead th:last-child,
    .memo-table thead th:nth-child(3),
    .memo-table thead th:nth-child(2) { text-align: right; }
    .memo-table tbody td {
      padding: 11px 14px; font-size: 13px;
      border-bottom: 1px solid #f0ebe3;
    }
    .memo-table tbody td:nth-child(2),
    .memo-table tbody td:nth-child(3),
    .memo-table tbody td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .memo-table tbody tr:last-child td { border-bottom: none; }
    .memo-table tbody tr:nth-child(even) { background: #fdf9f5; }
    .sl-col { color: #999; font-size: 11px; width: 30px; }

    .memo-totals {
      border-top: 2px solid #0a0602;
      padding: 16px 28px 20px;
      display: flex; justify-content: flex-end;
    }
    .totals-table { font-size: 13px; min-width: 240px; }
    .totals-table tr td { padding: 4px 0; }
    .totals-table tr td:last-child { text-align: right; padding-left: 40px; font-variant-numeric: tabular-nums; }
    .totals-table .disc { color: #e74c3c; }
    .totals-table .grand { font-size: 16px; font-weight: 700; color: #0a0602; border-top: 1px solid #ddd; padding-top: 8px; margin-top: 4px; }
    .totals-table .grand td { padding-top: 10px; }
    .totals-table .paid-row { color: #2e7d32; }
    .totals-table .due-row  { color: #c0392b; font-weight: 700; font-size: 15px; }

    .memo-footer {
      background: #f9f5f0; border-top: 1px solid #e8e0d4;
      padding: 16px 28px; display: flex; justify-content: space-between; align-items: flex-end;
    }
    .memo-footer .terms { font-size: 11px; color: #888; line-height: 1.7; max-width: 300px; }
    .memo-footer .sig { font-size: 11px; color: #888; text-align: right; }
    .memo-footer .sig-line { width: 120px; border-top: 1px solid #999; margin: 24px 0 4px auto; }

    .memo-stamp {
      text-align: center; padding: 10px 28px 16px; font-size: 10px;
      color: #bbb; letter-spacing: 1px;
      font-family: var(--ff-bn);
    }

    /* ── PRINT STYLES ──────────────────────────── */
    @media print {
      body { background: #fff !important; padding: 0; }
      .form-panel, .preview-label, .preview-panel { all: unset; }
      .app { display: block; }
      .preview-panel { padding: 0; background: #fff; display: block; }
      .memo {
        box-shadow: none; max-width: 100%;
        border-radius: 0;
      }
      .memo-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .memo-table thead { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .memo-table tbody tr:nth-child(even) { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ── FORM PANEL ──────────────────────────────── -->
  <div class="form-panel" id="formPanel">

    <div class="panel-logo">
      <div class="logo-ut">UT</div>
      <div>
        <span>ইউনিক ট্রেডার্স</span>
        <small>BILLING SYSTEM</small>
      </div>
    </div>

    <!-- CUSTOMER INFO -->
    <div class="section-head">Customer Details</div>

    <label>Customer Name / গ্রাহকের নাম</label>
    <input type="text" id="custName" placeholder="e.g. Mr. Karim" oninput="render()" />

    <label>Address / ঠিকানা</label>
    <input type="text" id="custAddr" placeholder="Village, Upazila, District" oninput="render()" />

    <label>Phone / মোবাইল</label>
    <input type="text" id="custPhone" placeholder="017XXXXXXXXX" oninput="render()" />

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <label>Memo No. / মেমো নং</label>
        <input type="text" id="memoNo" placeholder="001" oninput="render()" />
      </div>
      <div>
        <label>Date / তারিখ</label>
        <input type="date" id="memoDate" oninput="render()" />
      </div>
    </div>

    <!-- ITEMS -->
    <div class="section-head" style="margin-top:24px;">Items / পণ্য তালিকা</div>

    <div id="itemsContainer"></div>
    <button class="btn btn-add" onclick="addItem()">+ Add Item</button>

    <!-- PAYMENT -->
    <div class="section-head" style="margin-top:24px;">Payment / পেমেন্ট</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <label>Discount (৳)</label>
        <input type="number" id="discount" value="0" min="0" oninput="render()" />
      </div>
      <div>
        <label>Paid Amount (৳)</label>
        <input type="number" id="paidAmt" value="0" min="0" oninput="render()" />
      </div>
    </div>

    <label>Notes / বিশেষ মন্তব্য</label>
    <textarea id="notes" placeholder="Delivery date, special instructions..." oninput="render()"></textarea>

    <!-- TOTALS PREVIEW -->
    <div class="totals-preview" id="totalsPreview">
      <div class="tp-row"><span>Subtotal</span><span id="pr-sub">৳0</span></div>
      <div class="tp-row"><span>Discount</span><span id="pr-disc">-৳0</span></div>
      <div class="tp-row total"><span>Grand Total</span><span id="pr-total">৳0</span></div>
      <div class="tp-row paid"><span>Paid</span><span id="pr-paid">৳0</span></div>
      <div class="tp-row due"><span>Due</span><span id="pr-due">৳0</span></div>
    </div>

    <button class="btn btn-print" onclick="window.print()">🖨️ Print Cash Memo</button>
    <button class="btn btn-clear" style="width:100%;justify-content:center;margin-top:8px;" onclick="clearAll()">✕ Clear All / নতুন মেমো</button>

    <p style="font-size:11px;color:var(--text-dim);margin-top:12px;text-align:center;">
      Press <strong>Ctrl+P</strong> or click Print above
    </p>
  </div>

  <!-- ── PREVIEW PANEL ───────────────────────────── -->
  <div class="preview-panel">
    <div class="preview-label">Live Preview — এটি প্রিন্ট হবে</div>

    <div class="memo" id="memoPreview">
      <!-- rendered by JS -->
    </div>
  </div>

</div>

<script>
/* ── STATE ──────────────────────────────────────── */
let items = [
  { name: '', qty: 1, unit: 'pcs', price: 0 }
];

/* ── INIT ───────────────────────────────────────── */
document.getElementById('memoDate').value = new Date().toISOString().split('T')[0];
document.getElementById('memoNo').value = '001';
renderItems();
render();

/* ── ADD / REMOVE ITEMS ─────────────────────────── */
function addItem() {
  items.push({ name: '', qty: 1, unit: 'pcs', price: 0 });
  renderItems();
  render();
}
function removeItem(i) {
  if (items.length === 1) return;
  items.splice(i, 1);
  renderItems();
  render();
}
function updateItem(i, field, val) {
  items[i][field] = field === 'qty' || field === 'price' ? parseFloat(val) || 0 : val;
  render();
}

function renderItems() {
  const c = document.getElementById('itemsContainer');
  c.innerHTML = items.map((it, i) => `
    <div class="item-row">
      <div>
        ${i === 0 ? '<label>Product / পণ্যের নাম</label>' : ''}
        <input type="text" placeholder="e.g. RFL Plastic Door"
          value="${it.name}"
          oninput="updateItem(${i},'name',this.value)" />
      </div>
      <div>
        ${i === 0 ? '<label>Qty</label>' : ''}
        <input type="number" value="${it.qty}" min="1"
          oninput="updateItem(${i},'qty',this.value)" />
      </div>
      <div>
        ${i === 0 ? '<label>Unit Price (৳)</label>' : ''}
        <input type="number" value="${it.price}" min="0" placeholder="0"
          oninput="updateItem(${i},'price',this.value)" />
      </div>
      <div>
        ${i === 0 ? '<label>&nbsp;</label>' : ''}
        <button class="remove-btn" onclick="removeItem(${i})">✕</button>
      </div>
    </div>
  `).join('');
}

/* ── CALCULATIONS ───────────────────────────────── */
function calcTotals() {
  const sub      = items.reduce((s, it) => s + (it.qty * it.price), 0);
  const discount = parseFloat(document.getElementById('discount').value) || 0;
  const grand    = Math.max(0, sub - discount);
  const paid     = parseFloat(document.getElementById('paidAmt').value) || 0;
  const due      = Math.max(0, grand - paid);
  return { sub, discount, grand, paid, due };
}

function fmt(n) { return '৳' + n.toLocaleString('en-BD', { minimumFractionDigits: 0 }); }

/* ── RENDER PREVIEW ─────────────────────────────── */
function render() {
  const t = calcTotals();

  // Update sidebar totals
  document.getElementById('pr-sub').textContent   = fmt(t.sub);
  document.getElementById('pr-disc').textContent  = '-' + fmt(t.discount);
  document.getElementById('pr-total').textContent = fmt(t.grand);
  document.getElementById('pr-paid').textContent  = fmt(t.paid);
  document.getElementById('pr-due').textContent   = fmt(t.due);

  const custName  = document.getElementById('custName').value  || '—';
  const custAddr  = document.getElementById('custAddr').value  || '—';
  const custPhone = document.getElementById('custPhone').value || '—';
  const memoNo    = document.getElementById('memoNo').value    || '—';
  const notes     = document.getElementById('notes').value;
  const rawDate   = document.getElementById('memoDate').value;
  const memoDate  = rawDate ? new Date(rawDate).toLocaleDateString('en-BD', { day:'2-digit', month:'long', year:'numeric' }) : '—';

  const rows = items.map((it, i) => {
    const total = it.qty * it.price;
    return `<tr>
      <td class="sl-col">${i+1}</td>
      <td>${it.name || '—'}</td>
      <td>${it.qty}</td>
      <td>${fmt(it.price)}</td>
      <td>${fmt(total)}</td>
    </tr>`;
  }).join('');

  document.getElementById('memoPreview').innerHTML = `
    <div class="memo-header">
      <div class="memo-logo">
        <div class="memo-logo-box">UT</div>
        <div>
          <div class="memo-shop-bn">ইউনিক ট্রেডার্স</div>
          <div class="memo-shop-en">UNIQUE TRADERS</div>
        </div>
      </div>
      <div class="memo-header-right">
        <strong>আরএফএল অনুমোদিত ডিলার</strong>
        পূর্ব আদালত পাড়া, চৌরাস্তা মোড়<br/>
        টাংগাইল, বাংলাদেশ<br/>
        📞 01711-206261 · 01915-039277
      </div>
    </div>

    <div class="memo-title">
      <span>CASH MEMO</span> &nbsp;/&nbsp; নগদ রসিদ
    </div>

    <div class="memo-meta">
      <div class="memo-meta-block">
        <strong>Billed To / গ্রাহক</strong>
        ${custName}<br/>
        ${custAddr}<br/>
        ${custPhone}
      </div>
      <div class="memo-meta-block" style="text-align:right;">
        <strong>Memo No. / মেমো নং</strong>
        #${memoNo}<br/>
        <strong style="margin-top:6px;display:block;">Date / তারিখ</strong>
        ${memoDate}
      </div>
    </div>

    <table class="memo-table">
      <thead>
        <tr>
          <th style="width:30px;">#</th>
          <th>Product / পণ্য</th>
          <th style="width:60px;">Qty</th>
          <th style="width:110px;">Unit Price</th>
          <th style="width:110px;">Total</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>

    <div class="memo-totals">
      <table class="totals-table">
        <tr><td>Subtotal / মোট</td><td>${fmt(t.sub)}</td></tr>
        ${t.discount > 0 ? `<tr class="disc"><td>Discount / ছাড়</td><td>- ${fmt(t.discount)}</td></tr>` : ''}
        <tr class="grand"><td><strong>Grand Total / সর্বমোট</strong></td><td><strong>${fmt(t.grand)}</strong></td></tr>
        <tr class="paid-row"><td>Paid / প্রদত্ত</td><td>${fmt(t.paid)}</td></tr>
        <tr class="due-row"><td>Due / বাকি</td><td>${fmt(t.due)}</td></tr>
      </table>
    </div>

    <div class="memo-footer">
      <div class="terms">
        <strong style="display:block;margin-bottom:4px;">শর্তাবলী / Terms</strong>
        • পণ্য নিয়ে গেলে ফেরত নেওয়া হবে না।<br/>
        • বাকির টাকা নির্ধারিত সময়ে পরিশোধ করুন।<br/>
        ${notes ? `• ${notes}` : '• ধন্যবাদ আমাদের দোকানে আসার জন্য।'}
      </div>
      <div class="sig">
        <div class="sig-line"></div>
        স্বত্বাধিকারীর স্বাক্ষর<br/>
        <small>Gazi Md Abdulla Al Mahbub</small>
      </div>
    </div>

    <div class="memo-stamp">
      ইউনিক ট্রেডার্স, টাংগাইল &nbsp;|&nbsp; 📘 facebook.com/UniqueTraders
    </div>
  `;
}

function clearAll() {
  if (!confirm('Clear everything and start a new memo?')) return;
  document.getElementById('custName').value  = '';
  document.getElementById('custAddr').value  = '';
  document.getElementById('custPhone').value = '';
  document.getElementById('notes').value     = '';
  document.getElementById('discount').value  = '0';
  document.getElementById('paidAmt').value   = '0';
  document.getElementById('memoDate').value  = new Date().toISOString().split('T')[0];

  // Increment memo number
  const cur = parseInt(document.getElementById('memoNo').value) || 0;
  document.getElementById('memoNo').value = String(cur + 1).padStart(3, '0');

  items = [{ name: '', qty: 1, unit: 'pcs', price: 0 }];
  renderItems();
  render();
}
</script>
</body>
</html>
